# PureMusic version.
# - pureMusicVersion / pureMusicPatch: the shown version (0.3, 0.3.1, ...). Bump pureMusicVersion and reset
#   pureMusicPatch to 0 for PureMusic feature releases; the upstream-sync workflow bumps pureMusicPatch.
# - pureMusicBuild: only ever goes up (+1 on every release, manual or automatic). Together with Metrolist's
#   version code it gives a version code that always increases, so every release installs over the previous one.
pureMusicVersion=0.3
pureMusicPatch=3
pureMusicBuild=4
