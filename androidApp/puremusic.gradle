// PureMusic branding, applied after Metrolist's android {} block (see the PUREMUSIC-HOOK at the end of
// build.gradle.kts). Kept in its own file so upstream version bumps never conflict with it.
def pureMusicProps = new Properties()
file("puremusic.properties").withInputStream { pureMusicProps.load(it) }
def pureMusicVersion = pureMusicProps.getProperty("pureMusicVersion")
def pureMusicPatch = pureMusicProps.getProperty("pureMusicPatch").toInteger()
def pureMusicBuild = pureMusicProps.getProperty("pureMusicBuild").toInteger()

android {
    def upstreamVersionCode = defaultConfig.versionCode
    defaultConfig {
        applicationId "aiv.ashivered.puremusic"
        // Always increasing: Metrolist's code (rarely changes) * 10000 + PureMusic's build counter.
        // PureMusic 0.2 was 2 and 0.3 was 1015500; this formula stays above both.
        versionCode upstreamVersionCode * 10_000 + pureMusicBuild
        // Automated upstream syncs bump pureMusicPatch: 0.3 -> 0.3.1 -> 0.3.2 ...
        versionName(pureMusicPatch > 0 ? "${pureMusicVersion}.${pureMusicPatch}" : pureMusicVersion)
        // Metrolist's updater installs Metrolist releases; PureMusic ships its own.
        buildConfigField "Boolean", "UPDATER_ENABLED", "false"
    }
    // PureMusic icons and other resource overrides. Build-type resources take precedence over main,
    // so Metrolist's files can stay untouched.
    sourceSets.matching { it.name in buildTypes.names }.configureEach { set ->
        set.res.srcDir("src/puremusic/res")
    }
    buildTypes.configureEach { type ->
        type.manifestPlaceholders["appLabel"] = type.name == "debug" ? "PureMusic Debug" : "PureMusic"
    }
}

// Android-native strings (notifications, widgets) are generated from the same catalogs; feed the generator
// a branded copy.
def brandedCatalog = tasks.register("pureMusicBrandedCatalog", Sync) {
    from(rootProject.file("shared/src/commonMain/composeResources"))
    include("values*/**")
    inputs.file("puremusic.gradle")
    filesMatching("**/strings.xml") {
        filter { String line ->
            // Show PureMusic instead of Metrolist; URLs and identifiers (MetrolistGroup, metrolist.cc) stay.
            line.replaceAll(/(?<![\/.])Metrolist(?![A-Za-z])/, "PureMusic").replace("מטרוליסט", "PureMusic")
        }
    }
    into(layout.buildDirectory.dir("generated/puremusic/composeResources"))
}
tasks.named("generateAndroidStrings") {
    dependsOn(brandedCatalog)
    catalogDirectory.set(layout.buildDirectory.dir("generated/puremusic/composeResources"))
}
